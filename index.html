<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Weather App</h1>

        <form id="weatherForm">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                required
            >

            <button type="submit">
                Search
            </button>

        </form>

        <!-- Message -->
        <p id="message"></p>


        <!-- Current Weather -->
        <section id="currentWeather" class="card hidden">

            <h2 id="cityName"></h2>

            <img
                id="weatherIcon"
                src=""
                alt="Weather icon"
            >

            <h3 id="temperature"></h3>

            <p id="condition"></p>

            <p>
                💧 Humidity:
                <span id="humidity"></span>
            </p>

            <p>
                🌬️ Wind:
                <span id="wind"></span>
            </p>

            <p>
                🕒 Local time:
                <span id="localTime"></span>
            </p>

        </section>


        <!-- 5-Day Forecast -->
        <section
            id="forecastSection"
            class="card hidden"
        >

            <h2>5-Day Forecast</h2>

            <div
                id="forecast"
                class="forecast"
            ></div>

        </section>

    </div>


    <script src="script.js"></script>

</body>
</html>
